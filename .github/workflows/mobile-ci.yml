name: mobile-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  android:
    name: Android + shared (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests (shared commonTest on jvm(), androidApp)
        run: ./gradlew test

      - name: Coverage gate (minimum 80%, ARCHITECTURE §8.3)
        run: ./gradlew koverVerify :androidApp:koverVerifyDebug

      - name: Static analysis (detekt, incl. S4's domain framework-boundary rule)
        run: ./gradlew detekt

  ios:
    name: iOS (SwiftUI)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iosApp.xcodeproj from project.yml
        working-directory: iosApp
        run: xcodegen generate

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        working-directory: iosApp
        run: swiftlint lint --strict

      - name: Resolve an available iOS Simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_NAME=$(xcrun simctl list devices available iOS -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; names=[dev['name'] for devs in d.values() for dev in devs]; print(names[0] if names else '')")
          if [ -z "$DEVICE_NAME" ]; then
            echo "::error::No available iOS Simulator found on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: xcodebuild test
        working-directory: iosApp
        env:
          DEVICE_NAME: ${{ steps.simulator.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            CODE_SIGNING_ALLOWED=NO
